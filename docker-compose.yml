services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codesense-backend
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      API_V1_STR: ${API_V1_STR}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL}
    ports:
      - "8000:8000"
    networks:
      - home-server-backend

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: codesense-simulator
    restart: unless-stopped
    environment:
      SIMULATOR_SCENARIO: NORMAL
      SIMULATOR_TICK_INTERVAL_SECONDS: 5
      BACKEND_URL: http://codesense-backend:8000
    ports:
      - "8001:8001"
    depends_on:
      - backend
    networks:
      - home-server-backend

networks:
  home-server-backend:
    external: true