services:
  postgres:
    image: postgres:16-alpine
    container_name: codesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codesense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codesense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codesense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codesense-postgres-data:
